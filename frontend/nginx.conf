server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container ─────────────────────────────────────────
    # All /api/* requests are forwarded to the backend service.
    # The /api prefix is stripped before forwarding (rewrite rule).
    location /api/ {
        resolver 8.8.8.8;
        proxy_ssl_server_name on;
        proxy_pass https://payment-tracker-backend-cjct.onrender.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Never let the browser cache API responses — this was the cause
        # of the "Unexpected token '<'" error appearing after a config fix
        # had already been deployed.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Static files + SPA fallback ───────────────────────────────────────────
    # Try to serve the file directly; if not found, fall back to index.html
    # so that React Router handles client-side navigation (e.g. /customers/3).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}