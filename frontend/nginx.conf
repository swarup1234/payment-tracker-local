server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Static files + SPA fallback ───────────────────────────────────────────
    # No API proxy here — the browser calls VITE_API_URL (Render backend) directly.
    # VITE_API_URL is baked into the JS bundle at Docker build time via ARG/ENV.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}