server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container ─────────────────────────────────────────
    # All /api/* requests are forwarded to the backend service.
    # The /api prefix is stripped before forwarding (rewrite rule).
    location /api/ { return 200 "API-BLOCK-HIT"; }

    # ── Static files + SPA fallback ───────────────────────────────────────────
    # Try to serve the file directly; if not found, fall back to index.html
    # so that React Router handles client-side navigation (e.g. /customers/3).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
